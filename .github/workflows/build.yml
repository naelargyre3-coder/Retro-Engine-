name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1
      - name: Telecharger le core NES (FCEUmm)
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a core
          curl -fL -o fceumm.zip https://buildbot.libretro.com/nightly/android/latest/arm64-v8a/fceumm_libretro_android.so.zip
          unzip -o fceumm.zip -d core
          mv core/fceumm_libretro_android.so app/src/main/jniLibs/arm64-v8a/libfceumm_libretro_android.so
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: retro-engine-debug
          path: app/build/outputs/apk/debug/*.apk
