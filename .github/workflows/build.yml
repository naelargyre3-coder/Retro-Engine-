name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1
      - name: Telecharger les moteurs d'emulation
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a core
          for name in fceumm gambatte snes9x mgba genesis_plus_gx mupen64plus_next_gles3; do
            curl -fL -o $name.zip https://buildbot.libretro.com/nightly/android/latest/arm64-v8a/${name}_libretro_android.so.zip
            unzip -o $name.zip -d core
            mv core/${name}_libretro_android.so app/src/main/jniLibs/arm64-v8a/lib${name}_libretro_android.so
          done
      - name: Cache de LibretroDroid
        id: ldcache
        uses: actions/cache@v4
        with:
          path: app/libs/libretrodroid.aar
          key: libretrodroid-0.13.2-v1
      - name: Compiler LibretroDroid (si absent du cache)
        if: steps.ldcache.outputs.cache-hit != 'true'
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "cmake;3.22.1"
          git clone --depth 1 --branch 0.13.2 --recursive https://github.com/Swordfish90/LibretroDroid.git ld
          cd ld
          chmod +x gradlew
          ./gradlew :libretrodroid:assembleRelease --no-daemon -Pandroid.injected.build.abi=arm64-v8a
          mkdir -p ../app/libs
          cp libretrodroid/build/outputs/aar/*.aar ../app/libs/libretrodroid.aar
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: retro-engine-debug
          path: app/build/outputs/apk/debug/*.apk
