name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1
      - name: Telecharger les moteurs (NES, Game Boy, SNES, GBA)
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a core
            for name in fceumm gambatte snes9x mgba genesis_plus_gx; do
            curl -fL -o $name.zip https://buildbot.libretro.com/nightly/android/latest/arm64-v8a/${name}_libretro_android.so.zip
            unzip -o $name.zip -d core
            mv core/${name}_libretro_android.so app/src/main/jniLibs/arm64-v8a/lib${name}_libretro_android.so
          done
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: retro-engine-debug
          path: app/build/outputs/apk/debug/*.apk
